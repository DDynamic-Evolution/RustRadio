[package]
name = "rust-radio"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
base64 = "0.22"
symphonia = "0.5"
cpal = "0.16"
eframe = { version = "=0.33.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "symphonia-all"] }
rfd = "=0.15.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

[build-dependencies]
winresource = "0.1"
